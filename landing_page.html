<!DOCTYPE html>
<html>
<html lang="en">

<head>
    <title>GTA V Landing Page</title>
    <link rel="stylesheet" href="main_menu.css" />
    <link rel="stylesheet" href="landing_page.css" />
</head>

<body>
    <div class="landing_bounding_box">
        <div class="frontend_landing_page">
            <div id="landing_navbar">
                <button class="instructional_button instructional_button_controller">L1</button>
                <nav id="landing_navbar_tabs" class="landing_buttons" tabindex="-1">
                    <button id="landing_button_online" class="menu_button landing_button">ONLINE</button>
                    <button id="landing_button_online" class="menu_button landing_button">GTA+</button>
                    <button id="landing_button_online" class="menu_button landing_button">STORY</button>
                </nav>
                <button class="instructional_button instructional_button_controller">R1</button>
            </div>
            <div class="landing_window">
                <div class="landing_window_info">
                    <div class="landing_window_logo"></div>
                    <div class="landing_window_info_text">
                        <h1 class="landing_window_title">PLAY GTA ONLINE</h1>
                        <span class="landing_window_text">Create a new GTA Online character and get GTA$4,000,000 to kick-start your Criminal Career. Or sign in to Social Club and migrate your existing GTA Online profile.</span>
                    </div>
                </div>
                <div class="landing_window_char"></div>
            </div>
            <!-- <span class="landing_subtitle">Enter GTA Online's Freemode.</span> -->
            <span class="landing_subtitle">Revel in the unrivaled chaos of Los Santos with GTA Online.</span>
        </div>
    </div>
</body>

</html>

</html>
